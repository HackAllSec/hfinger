name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test -p 1 ./...

      - name: Race test rules engine
        run: go test -race ./rules

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Validate built-in rules
        run: go run main.go rules test rulesets/core

      - name: Validate LLM manifest
        run: |
          go run main.go llm manifest | tee /tmp/hfinger-llm-manifest.json
          grep -q '"name": "hfinger"' /tmp/hfinger-llm-manifest.json
          grep -q '"capabilities":' /tmp/hfinger-llm-manifest.json
          go run main.go llm skills | tee /tmp/hfinger-llm-skills.json
          grep -q '"name": "hfinger-result-triage"' /tmp/hfinger-llm-skills.json

      - name: Check rule quality baseline
        run: |
          go run main.go rules stats | tee /tmp/hfinger-rules-stats.txt
          go run main.go rules doctor --max-rules 0
          grep -q '^lint.errors=0$' /tmp/hfinger-rules-stats.txt
          warnings=$(awk -F= '/^lint.warnings=/{print $2}' /tmp/hfinger-rules-stats.txt)
          test "${warnings}" -le 2043

      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
