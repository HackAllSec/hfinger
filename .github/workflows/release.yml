name: Release
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions: read-all

jobs:
  build:
    permissions:
      contents: write # To upload release assets.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: 386
          - goos: windows
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: 386
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: arm
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse CHANGELOG
        id: parse_changelog
        run: |
          version=$(grep -E '## \[([0-9]+\.[0-9]+\.[0-9]+)\] - [0-9]{4}-[0-9]{2}-[0-9]{2}.*' CHANGELOG.md | head -n 1 | sed -E 's/## \[([0-9]+\.[0-9]+\.[0-9]+)\] - [0-9]{4}-[0-9]{2}-[0-9]{2}(.*)/\1 \2/')
          description=$(awk '/## \[/ {if (found) {found=0; exit} else {found=1; next}} found' CHANGELOG.md)
          echo "Latest Version: $version"
          echo "Release Notes: $description"
          latest_tag=$(git describe --tags `git rev-list --tags --max-count=1`)
          echo "Latest Tag: ${latest_tag#v}"
          if [[ "$(echo "${latest_tag#v}" | xargs)" == "$(echo "$version" | xargs)" ]]; then
              echo "Not a release event, ending workflow."
              exit 0
          fi
          echo "RELEASE_TAG=v$version" >> $GITHUB_OUTPUT
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_OUTPUT
          echo "$description" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Set up Go
        if: steps.parse_changelog.outputs.RELEASE_TAG != ''
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
  
      - name: Build
        if: steps.parse_changelog.outputs.RELEASE_TAG != ''
        run: |
          echo "Building for ${{ matrix.goos }}/${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 go build -ldflags="-s -w" -o hfinger-${{ matrix.goos }}-${{ matrix.goarch }}.exe main.go
            zip -r hfinger-${{ matrix.goos }}-${{ matrix.goarch }}.zip hfinger-${{ matrix.goos }}-${{ matrix.goarch }}.exe README.md README_EN.md LICENSE NOTICE docs/
          else
            GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 go build -ldflags="-s -w" -o hfinger-${{ matrix.goos }}-${{ matrix.goarch }} main.go
            zip -r hfinger-${{ matrix.goos }}-${{ matrix.goarch }}.zip hfinger-${{ matrix.goos }}-${{ matrix.goarch }} README.md README_EN.md LICENSE NOTICE docs/
          fi
          sha256sum hfinger-${{ matrix.goos }}-${{ matrix.goarch }}.zip > hfinger-${{ matrix.goos }}-${{ matrix.goarch }}.zip.sha256

      - name: Upload release assets
        if: steps.parse_changelog.outputs.RELEASE_TAG != ''
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: hfinger-*.zip*
          tag: ${{ steps.parse_changelog.outputs.RELEASE_TAG }}
          body: ${{ steps.parse_changelog.outputs.RELEASE_NOTES }}
          overwrite: true
          file_glob: true
          
