rules:
  - id: core-0020-grafana
    name: Grafana
    category: observability
    vendor: Grafana Labs
    priority: 90
    tags: [grafana, observability, dashboard]
    match:
      strategy: score
      threshold: 80
      probes:
        - id: grafana
          request: {method: GET, path: /}
          matchers:
            - type: title.contains
              value: Grafana
              weight: 45
              evidence: Grafana title
            - type: body.contains
              value: "grafana-app"
              weight: 55
              evidence: Grafana app root marker
    negative:
      - type: body.contains
        value: "Grafana documentation"
        reason: Exclude documentation pages
    metadata:
      references: ["https://grafana.com/"]
      confidence: high
    examples:
      positive:
        - title: Grafana
          body: '<grafana-app></grafana-app>'
      negative:
        - body: "Grafana documentation"


  - id: core-0021-prometheus
    name: Prometheus
    category: observability
    vendor: Prometheus
    priority: 85
    tags: [prometheus, metrics, observability]
    match:
      strategy: score
      threshold: 80
      probes:
        - id: prometheus
          request: {method: GET, path: /graph}
          matchers:
            - type: title.contains
              value: Prometheus Time Series Collection and Processing Server
              weight: 60
              evidence: Prometheus graph page title
            - type: body.contains
              value: "prometheus"
              weight: 30
              evidence: Prometheus frontend marker
    negative:
      - type: body.contains
        value: "Prometheus documentation"
        reason: Exclude documentation pages
    metadata:
      references: ["https://prometheus.io/"]
      confidence: high
    examples:
      positive:
        - path: /graph
          title: Prometheus Time Series Collection and Processing Server
          body: "prometheus"
      negative:
        - body: "Prometheus documentation"


