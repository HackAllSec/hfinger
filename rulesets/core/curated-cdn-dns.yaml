rules:
  - id: core-0116-cloudflare-cname
    name: Cloudflare CDN
    category: cdn
    vendor: Cloudflare
    priority: 90
    tags: [cdn, waf, dns]
    match:
      strategy: any
      matchers:
        - type: dns.cname.contains
          value: cloudflare.net
          weight: 100
          evidence: Cloudflare CNAME target
    negative:
      - type: body.contains
        value: Cloudflare documentation
        reason: Exclude documentation pages
    metadata:
      references: ["https://developers.cloudflare.com/dns/"]
      confidence: high
    examples:
      positive:
        - name: cloudflare-cname
          dns: {cname: example.cloudflare.net}
      negative:
        - name: cloudflare-doc
          body: Cloudflare documentation

  - id: core-0117-akamai-cname
    name: Akamai CDN
    category: cdn
    vendor: Akamai
    priority: 90
    tags: [cdn, dns]
    match:
      strategy: score
      threshold: 80
      matchers:
        - type: dns.cname.contains
          values: [akamai.net, akamaiedge.net, edgesuite.net, edgekey.net]
          weight: 100
          evidence: Akamai CNAME target
    negative:
      - type: body.contains
        value: Akamai documentation
        reason: Exclude documentation pages
    metadata:
      references: ["https://techdocs.akamai.com/"]
      confidence: high
    examples:
      positive:
        - name: akamai-cname
          dns: {cname: example.akamaiedge.net}
      negative:
        - name: akamai-doc
          body: Akamai documentation

