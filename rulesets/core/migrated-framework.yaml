    - id: builtin-0052
      name: Spring env
      category: framework
      tags:
        - migrated
        - framework
      match:
        strategy: all
        probes:
            - id: default
              matchers:
                - type: body.contains
                  value: servletContextInitParams
                  weight: 100
                  evidence: Migrated response body evidence for Spring env
                - type: body.contains
                  value: logback
                  weight: 100
                  evidence: Migrated response body evidence for Spring env
      negative:
        - type: body.contains
          value: Spring env 漏洞
          reason: Vulnerability articles can quote actuator environment keys without being an exposed Spring endpoint.
      metadata:
        references:
            - builtin:migrated-legacy-rule
        confidence: low

