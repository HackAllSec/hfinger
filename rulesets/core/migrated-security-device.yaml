rules:
    - id: builtin-0063
      name: Sangfor SSL VPN
      category: security-device
      tags:
        - migrated
        - security-device
      match:
        strategy: all
        probes:
            - id: default
              matchers:
                - type: body.contains
                  value: /por/login_psw.csp
                  weight: 100
                  evidence: Migrated response body evidence for Sangfor SSL VPN
      negative:
        - type: body.contains
          value: Sangfor SSL VPN 漏洞
          reason: Vulnerability articles can quote Sangfor SSL VPN login paths without being a deployed VPN.
      metadata:
        references:
