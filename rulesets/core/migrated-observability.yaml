rules:
    - id: builtin-0026
      name: Kibana
      category: observability
      tags:
        - migrated
        - observability
      match:
        strategy: all
        probes:
            - id: default
              matchers:
                - type: title.contains
                  value: Kibana
                  weight: 100
                  evidence: Migrated HTML title evidence for Kibana
      negative:
        - type: body.contains
          value: Kibana vulnerability
          reason: Vulnerability writeups and tutorials can mention Kibana without being a deployed observability service.
      metadata:
        references:
            - builtin:migrated-legacy-rule
        confidence: low

