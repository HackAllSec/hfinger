      strategy: score
      threshold: 80
      probes:
        - id: ollama-api
          request: {method: GET, path: /api/tags}
          matchers:
            - type: json.key.exists
              value: models
              weight: 60
              evidence: Ollama models key
            - type: body.contains
              value: "model"
              weight: 30
              evidence: Ollama model list field
    negative:
      - type: body.contains
        value: "Ollama documentation"
        reason: Exclude documentation pages
    metadata:
      references: ["https://github.com/ollama/ollama/blob/main/docs/api.md"]
      confidence: medium
    examples:
      positive:
        - path: /api/tags
          body: '{"models":[{"name":"llama3","model":"llama3"}]}'
      negative:
        - body: "Ollama documentation"


