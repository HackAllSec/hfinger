rules:
  - id: core-0044-gradio
    name: Gradio
    category: ai-service
    vendor: Gradio
    priority: 85
    tags: [ai, gradio, ml]
    match:
      strategy: score
      threshold: 80
      probes:
        - id: gradio
          request: {method: GET, path: /}
          matchers:
            - type: body.contains
              value: "gradio-app"
              weight: 55
              evidence: Gradio app root marker
            - type: body.contains
              value: "__gradio_mode__"
              weight: 45
              evidence: Gradio runtime mode marker
    negative:
      - type: body.contains
        value: "Gradio documentation"
        reason: Exclude documentation pages
    metadata:
      references: ["https://www.gradio.app/"]
      confidence: high
    examples:
      positive:
        - body: '<gradio-app></gradio-app><script>window.__gradio_mode__="app"</script>'
      negative:
        - body: "Gradio documentation"


