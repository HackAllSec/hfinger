rules:
  - id: core-0111-hfish
    name: HFish Honeypot
    category: honeypot
    vendor: HFish
    priority: 90
    tags: [honeypot, deception]
    match:
      strategy: score
      threshold: 100
      matchers:
        - type: body.contains
          value: "HFish"
          weight: 60
          evidence: HFish page marker
        - type: title.contains
          value: "HFish"
          weight: 40
          evidence: HFish title marker
    negative:
      - type: body.contains
        value: "HFish documentation"
        reason: Documentation page is not a deployed honeypot
    metadata:
      references: ["https://github.com/hacklcx/HFish"]
      confidence: high
    examples:
      positive:
        - name: hfish-login
          title: HFish
          body: "<html><title>HFish</title><body>HFish</body></html>"
      negative:
        - name: hfish-doc
          body: "HFish documentation"

  - id: core-0112-opencanary
    name: OpenCanary
    category: honeypot
    vendor: Thinkst
    priority: 85
    tags: [honeypot, deception]
    match:
      strategy: score
      threshold: 100
      matchers:
        - type: body.contains
          value: "OpenCanary"
          weight: 70
          evidence: OpenCanary page marker
        - type: header.contains
          key: Server
          value: "OpenCanary"
          weight: 40
          evidence: OpenCanary server header
    negative:
      - type: body.contains
        value: "OpenCanary documentation"
        reason: Documentation page is not a deployed honeypot
    metadata:
      references: ["https://github.com/thinkst/opencanary"]
      confidence: high
    examples:
      positive:
        - name: opencanary-page
          headers: {Server: OpenCanary}
          body: "OpenCanary"
      negative:
        - name: opencanary-doc
          body: "OpenCanary documentation"

