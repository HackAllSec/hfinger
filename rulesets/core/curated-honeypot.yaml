      confidence: high
    examples:
      positive:
        - name: tpot-page
          body: "T-Pot honeypot dashboard"
      negative:
        - name: tpot-doc
          body: "T-Pot documentation"

  - id: core-0114-cowrie
    name: Cowrie Honeypot
    category: honeypot
