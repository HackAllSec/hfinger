  - id: core-0004-jenkins
    name: Jenkins
    category: devops
    vendor: Jenkins
    priority: 90
    tags: [jenkins, ci, devops]
    match:
      strategy: score
      threshold: 80
      probes:
        - id: jenkins
          request: {method: GET, path: /}
          matchers:
            - type: header.contains
              key: X-Jenkins
              weight: 60
              evidence: X-Jenkins response header
            - type: body.contains
              value: "jenkins.model.Jenkins"
              weight: 40
              evidence: Jenkins frontend initialization marker
    negative:
      - type: body.contains
        value: "Jenkins user handbook"
        reason: Exclude documentation pages
    extract:
      - name: version
        type: header
        key: X-Jenkins
        regex: '([0-9]+(?:\.[0-9]+)+)'
        group: 1
        message: Jenkins version from X-Jenkins header
    metadata:
      references: ["https://www.jenkins.io/"]
      confidence: high
    examples:
      positive:
        - headers: {X-Jenkins: "2.440.1"}
          body: "window.app = jenkins.model.Jenkins"
      negative:
        - body: "Jenkins user handbook"

