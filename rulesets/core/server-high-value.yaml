        reason: Exclude documentation pages
    metadata:
      references: ["https://argo-cd.readthedocs.io/"]
      confidence: high
    examples:
      positive:
        - title: Argo CD
          body: '<div id="argo-cd"></div>'
      negative:
        - body: "Argo CD documentation"

