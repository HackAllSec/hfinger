rules:
  - id: core-0011-keycloak
    name: Keycloak
    category: middleware
    vendor: Keycloak
    priority: 85
    tags: [keycloak, iam, oidc]
    match:
      strategy: score
      threshold: 80
      probes:
        - id: keycloak
          request: {method: GET, path: /}
          matchers:
            - type: body.contains
              value: "keycloak"
              weight: 45
              evidence: Keycloak body marker
            - type: cookie.contains
              value: "KEYCLOAK"
              weight: 45
              evidence: Keycloak cookie marker
    negative:
      - type: body.contains
        value: "Keycloak documentation"
        reason: Exclude documentation pages
    metadata:
      references: ["https://www.keycloak.org/"]
      confidence: high
    examples:
      positive:
        - headers: {Set-Cookie: "KEYCLOAK_SESSION=abc"}
          body: "keycloak"
      negative:
        - body: "Keycloak documentation"


