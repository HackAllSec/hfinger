rules:
  - id: core-0024-elasticsearch
    name: Elasticsearch
    category: database
    vendor: Elastic
    priority: 85
    tags: [elasticsearch, search, database]
    match:
      strategy: score
      threshold: 80
      probes:
        - id: elasticsearch
          request: {method: GET, path: /}
          matchers:
            - type: json.key.exists
              value: cluster_name
              weight: 45
              evidence: Elasticsearch cluster_name key
            - type: json.key.exists
              value: tagline
              weight: 45
              evidence: Elasticsearch tagline key
            - type: body.contains
              value: "You Know, for Search"
              weight: 30
              evidence: Elasticsearch tagline
    negative:
      - type: body.contains
        value: "Elasticsearch documentation"
        reason: Exclude documentation pages
    metadata:
      references: ["https://www.elastic.co/elasticsearch"]
      confidence: high
    examples:
      positive:
        - body: '{"cluster_name":"elastic","tagline":"You Know, for Search"}'
      negative:
        - body: "Elasticsearch documentation"


  - id: core-0025-clickhouse-http
    name: ClickHouse HTTP
    category: database
    vendor: ClickHouse
    priority: 80
    tags: [clickhouse, database, http]
    match:
      strategy: score
      threshold: 80
      probes:
        - id: clickhouse
          request: {method: GET, path: /ping}
          matchers:
            - type: body.regex
              value: '(?m)^Ok\.$'
              weight: 50
              evidence: ClickHouse /ping response
            - type: header.contains
              key: X-ClickHouse-Server-Display-Name
              weight: 50
              evidence: ClickHouse server display header
    negative:
      - type: body.contains
        value: "ClickHouse documentation"
        reason: Exclude documentation pages
    metadata:
      references: ["https://clickhouse.com/docs/interfaces/http"]
      confidence: medium
    examples:
      positive:
        - path: /ping
          headers: {X-ClickHouse-Server-Display-Name: "clickhouse"}
          body: "Ok."
      negative:
        - body: "ClickHouse documentation"


