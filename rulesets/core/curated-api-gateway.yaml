  - id: core-0015-envoy
    name: Envoy Proxy
    category: api-gateway
    vendor: Envoy
    priority: 85
    tags: [envoy, proxy, gateway]
    match:
      strategy: score
      threshold: 80
      probes:
        - id: envoy
          request: {method: GET, path: /}
          matchers:
            - type: header.contains
              key: Server
              value: envoy
              weight: 70
              evidence: Envoy Server header
            - type: header.contains
              key: X-Envoy-Upstream-Service-Time
              weight: 40
              evidence: Envoy upstream timing header
    negative:
      - type: body.contains
        value: "Envoy documentation"
        reason: Exclude documentation pages
    extract:
      - name: version
        type: header
        key: Server
        regex: 'envoy/?([0-9]+(?:\.[0-9]+)+)'
        group: 1
        message: Envoy version from Server header
    metadata:
      references: ["https://www.envoyproxy.io/"]
      confidence: high
    examples:
      positive:
        - headers: {Server: "envoy", X-Envoy-Upstream-Service-Time: "12"}
      negative:
        - body: "Envoy documentation"


  - id: core-0018-spring-cloud-gateway
    name: Spring Cloud Gateway
    category: api-gateway
    vendor: VMware
    priority: 80
    tags: [spring, gateway, java]
    match:
      strategy: score
      threshold: 80
      probes:
        - id: spring-cloud-gateway
          request: {method: GET, path: /actuator/gateway/routes}
          matchers:
            - type: json.key.exists
              value: route_id
              weight: 50
              evidence: Spring Cloud Gateway route_id key
            - type: body.contains
              value: "predicates"
              weight: 30
              evidence: Gateway route predicates in actuator response
    negative:
      - type: body.contains
        value: "Spring Cloud Gateway documentation"
        reason: Exclude documentation pages
    metadata:
      references: ["https://spring.io/projects/spring-cloud-gateway"]
      confidence: medium
    examples:
      positive:
        - path: /actuator/gateway/routes
          body: '[{"route_id":"demo","predicates":["Path=/api/**"]}]'
      negative:
        - body: "Spring Cloud Gateway documentation"


