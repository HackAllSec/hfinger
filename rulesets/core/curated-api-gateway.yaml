rules:
  - id: core-0012-apache-apisix
    name: Apache APISIX
    category: api-gateway
    vendor: Apache
    priority: 90
    tags: [apisix, api-gateway, gateway]
    match:
      strategy: score
      threshold: 80
      probes:
        - id: apisix
          request: {method: GET, path: /}
          matchers:
            - type: header.contains
              key: Server
              value: APISIX
              weight: 60
              evidence: APISIX Server header
            - type: body.contains
              value: "Apache APISIX"
              weight: 40
              evidence: Apache APISIX body marker
    negative:
      - type: body.contains
        value: "Apache APISIX documentation"
        reason: Exclude documentation pages
    extract:
      - name: version
        type: header
        key: Server
        regex: 'APISIX/?([0-9]+(?:\.[0-9]+)+)'
        group: 1
        message: APISIX version from Server header
    metadata:
      references: ["https://apisix.apache.org/"]
      confidence: high
    examples:
      positive:
        - headers: {Server: "APISIX/3.9"}
          body: "Apache APISIX"
      negative:
        - body: "Apache APISIX documentation"


