      name: TWCMS
      category: cms
      tags:
        - migrated
        - cms
      match:
        strategy: all
        probes:
            - id: default
              matchers:
                - type: body.contains
                  value: href="/twcms/theme/default/css/global.css
                  weight: 100
                  evidence: Migrated response body evidence for TWCMS
      negative:
