rules:
  - id: core-0001-kubernetes-dashboard
    name: Kubernetes Dashboard
    category: cloud-native
    vendor: Kubernetes
    priority: 90
    tags: [kubernetes, dashboard, cloud-native]
    match:
      strategy: score
      threshold: 80
      probes:
        - id: kubernetes-dashboard
          request: {method: GET, path: /}
          matchers:
            - type: title.contains
              value: Kubernetes Dashboard
              weight: 60
              evidence: Kubernetes Dashboard page title
            - type: body.contains
              value: "kubernetes-dashboard"
              weight: 40
              evidence: Kubernetes Dashboard frontend asset marker
    negative:
      - type: body.contains
        value: "This dashboard shows Kubernetes examples"
        reason: Exclude documentation pages
    metadata:
      references: ["https://github.com/kubernetes/dashboard"]
      confidence: high
    examples:
      positive:
        - name: dashboard
          title: Kubernetes Dashboard
          body: '<script src="kubernetes-dashboard.js"></script>'
      negative:
        - name: docs
          title: Kubernetes Dashboard Docs
          body: "This dashboard shows Kubernetes examples"


  - id: core-0009-consul
    name: Consul
    category: cloud-native
    vendor: HashiCorp
    priority: 80
    tags: [consul, service-discovery, cloud-native]
    match:
      strategy: score
      threshold: 80
      probes:
        - id: consul
          request: {method: GET, path: /ui/}
          matchers:
            - type: title.contains
              value: Consul
              weight: 50
              evidence: Consul UI title
            - type: body.contains
              value: "consul-ui"
              weight: 50
              evidence: Consul UI frontend marker
    negative:
      - type: body.contains
        value: "Consul documentation"
        reason: Exclude documentation pages
    metadata:
      references: ["https://developer.hashicorp.com/consul"]
      confidence: high
    examples:
      positive:
        - path: /ui/
          title: Consul
          body: '<div id="consul-ui"></div>'
      negative:
        - body: "Consul documentation"


