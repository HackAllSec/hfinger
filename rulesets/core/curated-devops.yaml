            - type: header.contains
              key: X-SonarQube-Version
              weight: 40
              evidence: SonarQube version header
    negative:
      - type: body.contains
        value: "SonarQube documentation"
        reason: Exclude documentation pages
    extract:
      - name: version
        type: header
        key: X-SonarQube-Version
        regex: '([0-9]+(?:\.[0-9]+)+)'
        group: 1
        message: SonarQube version from response header
    metadata:
      references: ["https://www.sonarsource.com/products/sonarqube/"]
