rules:
  - id: core-0002-argo-cd
    name: Argo CD
    category: devops
    vendor: Argo Project
    priority: 90
    tags: [argocd, gitops, kubernetes]
    match:
      strategy: score
      threshold: 80
      probes:
        - id: argo-cd
          request: {method: GET, path: /}
          matchers:
            - type: title.contains
              value: Argo CD
              weight: 50
              evidence: Argo CD page title
            - type: body.contains
              value: "argo-cd"
              weight: 50
              evidence: Argo CD frontend marker
    negative:
      - type: body.contains
        value: "Argo CD documentation"
        reason: Exclude documentation pages
    metadata:
      references: ["https://argo-cd.readthedocs.io/"]
      confidence: high
    examples:
      positive:
        - title: Argo CD
          body: '<div id="argo-cd"></div>'
      negative:
        - body: "Argo CD documentation"


  - id: core-0003-harbor
    name: Harbor
    category: devops
    vendor: Harbor
    priority: 90
    tags: [harbor, registry, container]
    match:
      strategy: score
      threshold: 80
      probes:
        - id: harbor
          request: {method: GET, path: /}
          matchers:
            - type: title.contains
              value: Harbor
              weight: 45
              evidence: Harbor page title
            - type: body.contains
              value: "harbor.app"
              weight: 55
              evidence: Harbor Angular app marker
    negative:
      - type: body.contains
        value: "Harbor documentation"
        reason: Exclude documentation pages
    metadata:
      references: ["https://goharbor.io/"]
      confidence: high
    examples:
      positive:
        - title: Harbor
          body: '<harbor-app></harbor-app><script src="harbor.app.js"></script>'
      negative:
        - body: "Harbor documentation"


  - id: core-0004-jenkins
    name: Jenkins
    category: devops
    vendor: Jenkins
    priority: 90
    tags: [jenkins, ci, devops]
    match:
      strategy: score
      threshold: 80
      probes:
        - id: jenkins
          request: {method: GET, path: /}
          matchers:
            - type: header.contains
              key: X-Jenkins
              weight: 60
              evidence: X-Jenkins response header
            - type: body.contains
              value: "jenkins.model.Jenkins"
              weight: 40
              evidence: Jenkins frontend initialization marker
    negative:
      - type: body.contains
        value: "Jenkins user handbook"
        reason: Exclude documentation pages
    extract:
      - name: version
        type: header
        key: X-Jenkins
        regex: '([0-9]+(?:\.[0-9]+)+)'
        group: 1
        message: Jenkins version from X-Jenkins header
    metadata:
      references: ["https://www.jenkins.io/"]
      confidence: high
    examples:
      positive:
        - headers: {X-Jenkins: "2.440.1"}
          body: "window.app = jenkins.model.Jenkins"
      negative:
        - body: "Jenkins user handbook"


  - id: core-0005-gitlab
    name: GitLab
    category: devops
    vendor: GitLab
    priority: 90
    tags: [gitlab, scm, devops]
    match:
      strategy: score
      threshold: 80
      probes:
        - id: gitlab
          request: {method: GET, path: /}
          matchers:
            - type: body.contains
              value: "assets/gitlab_logo"
              weight: 50
              evidence: GitLab logo asset marker
            - type: body.contains
              value: "gon.gitlab_url"
              weight: 50
              evidence: GitLab runtime config marker
    negative:
      - type: body.contains
        value: "GitLab documentation"
        reason: Exclude documentation pages
    metadata:
      references: ["https://about.gitlab.com/"]
      confidence: high
    examples:
      positive:
        - body: 'assets/gitlab_logo gon.gitlab_url="https://gitlab.example"'
      negative:
        - body: "GitLab documentation"


  - id: core-0006-sonarqube
    name: SonarQube
    category: devops
